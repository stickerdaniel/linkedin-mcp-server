[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --strict-markers -ra
markers =
    browser_dom: evaluates extractor JS against a real chromium DOM; skipped when no browser is installed
    camoufox_smoke: launches the real Camoufox engine; skipped when no binary is fetched or the driver crashes
