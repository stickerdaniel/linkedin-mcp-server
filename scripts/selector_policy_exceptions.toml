# Selector dependencies scripts/check_selector_policy.py accepts.
#
# Each entry allows `count` occurrences of the exact `text` inside `symbol`
# (the innermost enclosing function or class, the module-level assignment, or
# <module>) of `file`. A changed value, an added occurrence and a removed one
# all fail the check, so edit the entry together with the code.
# `reason` says why text, URL or attribute presence was not enough.

[[exception]]
file = "linkedin_mcp_server/core/auth.py"
symbol = "is_logged_in"
text = ".global-nav__primary-link"
count = 1
reason = "Login marker for the older global nav; new_selectors covers the current nav by href and is checked alongside it."

[[exception]]
file = "linkedin_mcp_server/core/auth.py"
symbol = "is_logged_in"
text = ':has-text("Home")'
count = 1
reason = "English label fallback beside the href-based nav selectors, which hold in every locale."

