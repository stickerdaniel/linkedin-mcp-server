# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A stacked pull request
  # is based on the branch below it, so filtering by base branch skipped CI
  # entirely for the stacks this repository's workflow produces.
  pull_request:

# Cancel a run that a newer push to the same ref replaced. That includes main:
# a commit merged in a burst can lose its run. Manual differential evidence is
# a separate workflow, so a push here cannot cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has a bound well above its measured runtime. Without one a wedged
# process holds its runner for the hosted limit of six hours.
jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Optimize uv cache for CI
        run: uv cache prune --ci

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

      # The action reports snapshot warnings after its retry window but does not
      # fail on them. That can make a missing head snapshot look like an empty
      # dependency diff, so query the same comparison and reject any warning.
      - name: Require complete dependency snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/dependency-comparison"
          gh api --include \
            "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}?per_page=100" \
            > "$response"
          python3 - "$response" <<'PY'
          import sys
          from pathlib import Path

          header = "x-github-dependency-graph-snapshot-warnings:"
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              if not line:
                  break
              if line.lower().startswith(header) and line[len(header) :].strip():
                  raise SystemExit("Dependency comparison returned snapshot warnings")
          PY

  # Which optional matrices a pull request needs. Full history so the merge base
  # of a stacked pull request, including a fork, is present. A git failure writes
  # no output; `test` then fails closed.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrices: ${{ steps.detect.outputs.matrices }}
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes that need optional matrices
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changes.py

  windows-daemon:
    name: Windows daemon (Python ${{ matrix.python-version }})
    # Pull requests only, and only when the diff can affect these tests. Main
    # does not repeat the matrix. `test` rejects a skip when this was required.
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.result == 'success'
      && needs.changes.outputs.matrices == 'required'
    runs-on: windows-latest
    timeout-minutes: 15
    # FastMCP 4's camelCase read shims off for every test run, set before
    # Python starts so the settings fastmcp reads at import already see it.
    # tests/conftest.py sets the same for local runs, and
    # tests/test_fastmcp_compatibility.py fails if it did not take effect.
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    strategy:
      fail-fast: false
      matrix:
        # 3.12.4 exactly, because it is the declared floor, the one version
        # where private state creation on Windows became possible at all, and it
        # carries the eight-client election stress again. 3.12.10 historically
        # crashed a frontend with 0xC0000005 while 3.12.4, 3.13 and 3.14 passed.
        # That incident is why no version here may be dropped on the argument
        # that a middle release can only fail where an endpoint already does: in
        # this subsystem one demonstrably did. The floating `3.12` entry remains
        # absent so product CI does not silently move between patch releases.
        python-version: ["3.12.4", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --group dev

      # #838: a frontend in this job has twice exited 0xC0000005 with no fault
      # location. `faulthandler` cannot always supply one, because the report
      # is written by the process that is already failing; Windows Error
      # Reporting writes from outside it, so a dump survives what the process
      # could not report. `DumpType` 1 is a minidump: the faulting stack is the
      # missing evidence, and a full heap dump of eight Python processes is
      # hundreds of megabytes per crash. Costs nothing on a green run, which is
      # every run since the crashing interpreter left the matrix.
      - name: Arm a crash dump for #838
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $folder -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpCount -Value 16 -Type DWord
          Set-ItemProperty -Path $key -Name DumpType -Value 1 -Type DWord

      - name: Run daemon protocol and containment tests
        run: >-
          uv run pytest
          tests/test_daemon_election.py::TestAtomicStartupCommit
          tests/test_daemon_election.py::TestElectionSettlement
          tests/test_daemon_election.py::TestOwnerBootstrapOrdering
          tests/test_daemon_election.py::TestPublishingLast
          tests/test_daemon_election.py::TestRealOwner::test_an_owner_is_started_and_answers
          tests/test_daemon_election.py::TestRealOwner::test_a_crashed_owner_is_replaced
          tests/test_daemon_election.py::TestRealOwner::test_many_clients_starting_at_once_elect_exactly_one_owner
          tests/test_daemon_election.py::TestRealOwner::test_launch_barrier_timeout_exits_without_electing
          tests/test_daemon_election.py::TestRealOwner::test_launch_barrier_failure_collects_started_frontends
          tests/test_daemon_election.py::TestAForwardedCallThroughTheRealOwner
          tests/test_daemon_proxy.py::TestAnOwnerProcessKilledMidCall
          tests/test_bootstrap.py::TestInstallerSupervisorLaunch::test_real_cpython_wait_unregister_contract
          tests/test_daemon_descriptor.py::TestPreparedCommit
          tests/test_daemon_descriptor.py::TestStateLocation
          tests/test_daemon_lock.py
          tests/test_installer_supervisor.py
          tests/test_installer_worker.py
          tests/test_process_tree.py
          tests/test_daemon_regression_witnesses.py
          tests/test_windows_guardian_probe.py
          tests/test_private_state.py
          tests/test_storage_class.py

      # Only on failure, and tolerant of an empty folder: a Python exception
      # fails this job without ever reaching Windows Error Reporting, and that
      # is the ordinary red run.
      - name: Upload the crash dump
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-${{ matrix.python-version }}
          path: ${{ runner.temp }}/crash-dumps
          if-no-files-found: ignore
          retention-days: 14

      - run: uv cache prune --ci

  # The full Linux suite, including coverage and the browser tests. It starts
  # immediately: the optional matrices are not on its path. Native differential
  # rows self-skip without LINKEDIN_MCP_DIFFERENTIAL_CI; that suite is manual.
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # The camelCase read shims off, for the reason given at `windows-daemon`.
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --group dev

      # The browser is keyed on the runner OS, architecture and resolved
      # patchright version, because that is what decides which Chromium revision
      # `install` fetches. The same key is used by the manual evidence workflow.
      # Read from the synced environment rather than from `pyproject.toml`, which
      # names a floor and not the version in use.
      - name: Resolve the patchright version
        id: patchright
        run: |
          version=$(uv run python -c 'from importlib.metadata import version; print(version("patchright"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.patchright.outputs.version }}

      # `--no-shell`, the same install the server performs: the headless shell
      # is a different product with no plugins and no `window.chrome`, and
      # nothing here launches it. `--with-deps` runs on a cache hit too, since
      # the cache holds the browser and not the apt packages it links against;
      # it also brings Xvfb, which is in playwright's `tools` dependency group.
      - name: Install the browser
        run: uv run patchright install --with-deps chromium --no-shell

      # A headed browser needs a display. The default mode does not on Linux,
      # where the hidden target is unsupported and Chromium's own headless mode
      # runs instead, but the identity gate launches headed as well and that is
      # the mode where the headless token has to be absent.
      - name: Start a display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 100); do
            if [ -S /tmp/.X11-unix/X99 ]; then exit 0; fi
            sleep 0.1
          done
          echo "Xvfb never created /tmp/.X11-unix/X99:" >&2
          cat /tmp/xvfb.log >&2
          exit 1

      # An unsupported group flag is reported as UNSUPPORTED, not readiness.
      - name: Measure retained leader pidfd group signaling
        run: uv run pytest -v -s -o faulthandler_timeout=120 tests/test_pidfd_group_signal.py::test_retained_leader_pidfd_signals_its_group_after_reaping

      # `--dist loadgroup` keeps every test that launches Chromium on one
      # worker. The identity cases share two cached launches; the DOM and auth
      # contracts launch per case, and the DOM timers use wall-clock deadlines
      # that concurrent browser startups made flaky. Tests without the group
      # mark are distributed exactly as before.
      - name: Run tests
        env:
          DISPLAY: ":99"
        run: uv run pytest --cov --cov-report=term-missing -n auto --dist loadgroup -v -s

      # Identity tests write first-navigation diagnostics here on GitHub
      # Actions. Always, so a red run keeps them.
      - name: Keep the differential evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-evidence-ubuntu-latest
          path: ${{ runner.temp }}/differential-evidence
          if-no-files-found: warn
          retention-days: 14

      - run: uv cache prune --ci

  # Everything here coordinates, protects or queries state through the operating
  # system rather than through Python, so each platform runs a different
  # implementation: the lease locks with flock or with LockFileEx, and
  # owner-only storage is a permission bit or an access control list. The
  # Ubuntu job above executes neither Windows path. Serial by choice: the lease
  # tests spawn their own competing processes, and xdist would only add
  # scheduling noise on top of that.
  platform-behaviour:
    name: Platform behaviour (${{ matrix.os }})
    # Same gate as `windows-daemon`: relevant pull requests only, not main.
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.result == 'success'
      && needs.changes.outputs.matrices == 'required'
    runs-on: ${{ matrix.os }}
    # The camelCase read shims off, for the reason given at `windows-daemon`.
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    # Cold browser download plus the platform contracts and the identity gate,
    # measured at under nine minutes on every leg. Native differential rows are
    # manual and are not part of this budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browsers: ~/Library/Caches/ms-playwright
          - os: windows-latest
            browsers: ~\AppData\Local\ms-playwright
          # Here for the browser rather than for the operating system. The
          # release publishes an arm64 image, and its browser is a separate
          # build from every other leg's: Chrome for Testing for linux-arm64
          # at the lock, Playwright's own Chromium through patchright 1.61.2.
          # Without this leg an identity regression in that build reaches the
          # container with both other jobs green.
          - os: ubuntu-24.04-arm
            browsers: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --group dev

      # ``faulthandler_timeout`` rather than a plugin: it is pytest's own, and
      # what it buys is the stack of every thread at the moment a test stops
      # making progress. These tests wait on processes they started, so the
      # difference between a slow one and a stuck one is not visible from the
      # outside and the report is the only way to tell them apart.
      - name: Run platform behaviour tests
        run: >-
          uv run pytest -v -o faulthandler_timeout=120
          tests/test_profile_lease.py
          tests/test_profile_lease_integration.py
          tests/test_private_state.py
          tests/test_session_state.py::test_the_native_machine_api_answers_on_windows
          tests/test_daemon_lock.py
          tests/test_process_tree.py
          tests/test_daemon_regression_witnesses.py
          tests/test_greenlet_runtime.py
          tests/test_storage_class.py
          tests/differential/test_watcher.py
          tests/differential/test_host_stub.py
          tests/differential/test_preservation_gate.py
          tests/differential/test_baseline.py
          tests/differential/test_signals.py
          tests/differential/test_failed_job_query.py

      # The identity gate runs on every leg, because every leg's browser is a
      # different one from the Ubuntu job's. macOS is the only platform with a
      # hidden target, which is the whole reason the default mode can run
      # without announcing itself as headless. Linux arm64 runs the browser
      # build the arm64 image ships. Windows has its own binary, its own window
      # manager and its own DPI handling, and the gate measures a headed window against the screen
      # it stands on -- which is exactly where those differ. An earlier version
      # of this file left Windows out on the grounds that it falls back to
      # headless mode like Linux does; that is true of one case in that file
      # and says nothing about the rest of them.
      #
      # When this matrix is required, a red leg fails `test`. Branch protection
      # requires `lint-and-check` and `test` by those names. On main, and on a
      # pull request whose diff does not need this matrix, the job is skipped
      # and `test` requires that skip.
      #
      # `shell: bash` because one of the legs is Windows, where the default is
      # PowerShell and none of the syntax below means anything.
      - name: Resolve the patchright version
        id: patchright
        shell: bash
        run: |
          version=$(uv run python -c 'from importlib.metadata import version; print(version("patchright"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.browsers }}
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.patchright.outputs.version }}

      # `--with-deps` on Linux only. It is the platform where a missing
      # system library stops Chromium starting at all, and the runner image
      # makes no promise about them. macOS needs none, and on Windows the
      # switch installs a Media Pack through a script that wants privileges
      # this job has no reason to take.
      - name: Install the browser
        run: uv run patchright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium --no-shell

      # Same reason as the Ubuntu job: the headed half of the gate needs
      # somewhere to put a window, and the default half does not.
      - name: Start a display
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 100); do
            if [ -S /tmp/.X11-unix/X99 ]; then exit 0; fi
            sleep 0.1
          done
          echo "Xvfb never created /tmp/.X11-unix/X99:" >&2
          cat /tmp/xvfb.log >&2
          exit 1

      # Separate from the process tests above, which run before a browser
      # exists and would skip this. It belongs on every leg because the
      # attribution differs per platform: POSIX scans for an environment
      # marker the browser carries, while Windows has no such marker and
      # depends on Chromium joining the Job its Node driver was assigned to
      # -- a fact about Windows that only Windows can confirm.
      - name: Run the browser containment test
        run: uv run pytest tests/test_browser_containment.py

      - name: Run the Windows browser launch evidence
        if: runner.os == 'Windows'
        env:
          UV_PYTHON: "3.13"
        run: uv run pytest -v -s -o faulthandler_timeout=120 tests/test_windows_browser_launch_evidence.py

      - name: Run the identity gate
        env:
          # Only where one was started. macOS ignores it, but naming a display
          # that does not exist is the kind of thing someone later debugs.
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
        run: uv run pytest tests/test_browser_identity.py

      # Identity tests write first-navigation diagnostics here on GitHub
      # Actions. Always, so a red run keeps them.
      - name: Keep the differential evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/differential-evidence
          if-no-files-found: warn
          retention-days: 14

      - run: uv cache prune --ci

  # Branch protection on `main` requires `lint-and-check` and `test` by those
  # names. This job is that check and does not run the suite. `if: always()`
  # so an upstream failure still reaches the decision; a skipped required check
  # would be a green one. Linux must succeed. A pull request also needs
  # dependency review and a successful path decision. Optional matrices must
  # succeed when required and be skipped when not. Any other result fails.
  test:
    needs: [linux, dependency-review, changes, windows-daemon, platform-behaviour]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The review job is skipped for pushes to main. On pull requests it joins
      # this required check instead of adding a branch-protection context.
      - name: Require dependency review on pull requests
        if: github.event_name == 'pull_request'
        run: test '${{ needs.dependency-review.result }}' = success

      - name: Checkout the gate
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require the expected results
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINUX_RESULT: ${{ needs.linux.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DETECTION_RESULT: ${{ needs.changes.result }}
          MATRICES: ${{ needs.changes.outputs.matrices }}
          WINDOWS_DAEMON_RESULT: ${{ needs.windows-daemon.result }}
          PLATFORM_BEHAVIOUR_RESULT: ${{ needs.platform-behaviour.result }}
        run: python3 scripts/ci_gate.py
