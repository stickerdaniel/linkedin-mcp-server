name: README

# Runs only when the README tools table or its check can have changed.
on:
  pull_request:
    paths:
      - README.md
      - scripts/check_readme_tool_table.py
      - scripts/github-readme-font.json
      - .github/workflows/readme.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tool-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check that every tool description fits one line on GitHub
        run: python3 scripts/check_readme_tool_table.py
