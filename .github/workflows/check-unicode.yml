name: Check Unicode

# Invisible and look-alike characters make text read differently from what it
# does: a bidi override reorders code on screen (Trojan Source), a zero-width
# or tag character hides text, and a Cyrillic "a" inside a Latin word defeats a
# string comparison. None of them shows up in review, and nothing else here
# looks for them: the Ruff rule set selected in pyproject.toml has none of
# its Unicode rules. The PR body counts as well, because it becomes the squash
# commit message.
#
# no-ai-marks does the scanning. Its AI attribution rules are switched off in
# .github/no-ai-marks.toml: attribution is Check Attribution's job, and its
# footer rule would reject the "Generated with" line this repository requires.
on:
  # pull_request_target, as in Check Attribution: under pull_request the
  # workflow comes from the PR, so the PR that plants a character could also
  # replace the scan with a no-op and still pass. This event runs the base
  # branch's copy of this file. Nothing from the PR is executed: the action
  # only reads git objects, and it takes its config from the base commit too.
  # "edited" re-checks a changed description.
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-unicode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          # The commit range and the merge base need history.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "Invalid pull request number"; exit 1 ;;
          esac
          git check-ref-format "refs/heads/${BASE_REF}"
          git fetch --no-tags origin \
            "refs/heads/${BASE_REF}" \
            "refs/pull/${PR_NUMBER}/head"

      - name: Scan commits, PR text and added lines
        uses: mishan/no-ai-marks@747c07a76d2ad6471fa73779dc8de97fbcb4aefe # v0.1.1
        with:
          config: .github/no-ai-marks.toml
          checks: commits,pr,files
