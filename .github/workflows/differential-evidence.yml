# Manual differential evidence. One platform and one group is the default,
# which is a single Linux job. `all` expands that axis. A failing row fails
# this run; nothing here reports the required `test` check.
name: Differential evidence

on:
  workflow_dispatch:
    inputs:
      platform:
        description: One platform, or all
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - all
      group:
        description: One evidence group, or all
        required: true
        type: choice
        default: native
        options:
          - native
          - pipes
          - processes
          - idle
          - owner
          - commands
          - auth
          - eligibility
          - all

# A later dispatch or a push does not cancel evidence that is already running.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - name: Checkout the planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select the evidence jobs
        id: plan
        env:
          EVIDENCE_PLATFORM: ${{ inputs.platform }}
          EVIDENCE_GROUP: ${{ inputs.group }}
        run: python3 scripts/ci_evidence.py

  evidence:
    name: Native evidence (${{ matrix.os }}, ${{ matrix.rows }})
    needs: plan
    runs-on: ${{ matrix.os }}
    # The camelCase read shims off, for the reason given at `windows-daemon`.
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    # Seven groups of rows per leg, so no job's bound comes near the hosted
    # runner's six hours. The sum of a group's step bounds: 45 for a cold
    # browser download for each runtime and the frozen baseline (bound 15),
    # with room for Windows, the slowest leg, to sync and install twice; then
    # `pipes` 30 for H-CAL and 45 for each of its two loss steps (165),
    # `processes` 5 for the oracle and 45 for each of its three (185),
    # `idle` 50 for each of the two H-R13 steps and 35 for each of the four
    # turnover lanes (285), and `owner` 5 for the oracle, 40 for each of the
    # three H-R8 lanes that kill, 45 for the stopped owner and 50 for H-R9
    # (265), `commands` 30 for H-R10a's logout, 40 for its declined and
    # no-terminal cells, 40 for H-R10b and 30 for H-R15 (185), `auth` 105
    # for H-R16's cold and second-frontend cells, 60 for its failed login and
    # 55 for H-R10a's login (265), and `eligibility` 55 for the daemon switched
    # off, 30 for a container, 40 for HTTP, 80 for synced storage, 30 for
    # unknown storage and 75 for H-R14 (355).
    # `native` takes 10 for the synthetic origin, 20 for H-R1, 5 for the
    # oracle on Linux, 25 for a custom browser, 45 for H-R3 and H-R2, 25 for
    # the killed owner, 25 for the failed Job query on Windows and 45 for the
    # unconfirmed close (240, from Windows, its largest leg).
    timeout-minutes: ${{ matrix.rows == 'native' && 240 || matrix.rows == 'pipes' && 165 || matrix.rows == 'processes' && 185 || matrix.rows == 'owner' && 265 || matrix.rows == 'commands' && 185 || matrix.rows == 'auth' && 265 || matrix.rows == 'eligibility' && 355 || 285 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --group dev

      # Windows' own side of a row's browser that vanished, armed before
      # anything launches one. The driver log (`DEBUG` at H-R1 below) says how
      # the browser ended; this is for who ended it. The LocalDumps keys of
      # `Arm a crash dump for #838` in `windows-daemon`, minidumps for the same
      # reason, in a folder of their own. Not the capture to rely on: Chromium
      # dumps on Windows whether or not it was passed `--disable-breakpad`
      # (149 and 153), and a fault that handler takes never reaches Windows
      # Error Reporting. The failure step copies the report Crashpad wrote.
      # What lands here is a fault the handler did not take. The file written
      # last opens the window the failure step reads the event logs over. An
      # empty folder and no record do not prove no crash: a process whose
      # error mode carries SEM_NOGPFAULTERRORBOX skips Windows Error Reporting
      # altogether, as one inherited from above pytest did for #838
      # (docs/windows-crash-dumps.md). Costs nothing on a green run.
      - name: Arm a crash dump for a vanished browser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'browser-crash-dumps'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $folder -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpCount -Value 16 -Type DWord
          Set-ItemProperty -Path $key -Name DumpType -Value 1 -Type DWord
          (Get-Date).ToUniversalTime().ToString('o') |
            Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'windows-evidence-since.txt') -Encoding ascii

      # As in `platform-behaviour`: the browser is keyed on the resolved
      # patchright version, and `shell: bash` because one leg is Windows.
      - name: Resolve the patchright version
        id: patchright
        shell: bash
        run: |
          version=$(uv run python -c 'from importlib.metadata import version; print(version("patchright"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.browsers }}
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.patchright.outputs.version }}

      # `--with-deps` on Linux only, for the reason given in `platform-behaviour`.
      - name: Install the browser
        run: uv run patchright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium --no-shell

      - name: Start a display
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 100); do
            if [ -S /tmp/.X11-unix/X99 ]; then exit 0; fi
            sleep 0.1
          done
          echo "Xvfb never created /tmp/.X11-unix/X99:" >&2
          cat /tmp/xvfb.log >&2
          exit 1

      - name: Issue the synthetic origin certificates
        shell: bash
        run: uv run python tests/differential/synthetic_origin.py "$RUNNER_TEMP/synthetic-origin"

      # The trust and fence step of `platform-behaviour`, unchanged: one store
      # per platform, the hosts file, and the guard that admits nothing but a
      # disposable GitHub-hosted runner.
      - name: Trust the synthetic CA and fence off the real names
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_ACTIONS:-}" != true ] || [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ] || [ -n "${ACT:-}" ]; then
            echo "Refusing to change a trust store outside a disposable GitHub-hosted runner" >&2
            exit 1
          fi
          ca="$RUNNER_TEMP/synthetic-origin/ca.pem"
          name="linkedin-mcp synthetic origin test CA"
          case "$RUNNER_OS" in
            Linux)
              if ! command -v certutil >/dev/null; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq libnss3-tools
              fi
              db="$HOME/.pki/nssdb"
              mkdir -p "$db"
              if [ ! -f "$db/cert9.db" ]; then
                certutil -d "sql:$db" -N --empty-password
              fi
              certutil -d "sql:$db" -A -t "C,," -n "$name" -i "$ca"
              echo "Trust store: NSS sql:$db"
              certutil -d "sql:$db" -L
              ;;
            macOS)
              sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$ca"
              echo "Trust store: admin trust settings, /Library/Keychains/System.keychain"
              security dump-trust-settings -d | grep -F -A4 "$name"
              ;;
            Windows)
              certutil.exe -addstore -f Root "$(cygpath -w "$ca")"
              echo "Trust store: LocalMachine\\Root"
              certutil.exe -store Root "$name"
              ;;
            *)
              echo "No trust step for $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          hosts="$(printf '\n127.0.0.1 www.linkedin.com static.licdn.com synthetic-canary.test\n::1 www.linkedin.com static.licdn.com synthetic-canary.test\n')"
          case "$RUNNER_OS" in
            Linux)
              printf '%s\n' "$hosts" | sudo tee -a /etc/hosts >/dev/null
              cat /etc/hosts
              ;;
            macOS)
              printf '%s\n' "$hosts" | sudo tee -a /etc/hosts >/dev/null
              sudo dscacheutil -flushcache
              sudo killall -HUP mDNSResponder
              cat /etc/hosts
              ;;
            Windows)
              hosts_file=/c/Windows/System32/drivers/etc/hosts
              printf '%s\n' "$hosts" >> "$hosts_file"
              MSYS_NO_PATHCONV=1 ipconfig.exe /flushdns
              cat "$hosts_file"
              ;;
          esac


      # The only step that opts in. A pass says the synthetic names resolved to
      # loopback for the system and for an unproxied browser, the proxy refused
      # a name it does not route before www.linkedin.com was named, the feed
      # loaded under this run's CA, and a CA nobody trusted was still refused.
      - name: Load the synthetic origin through the proxy
        if: matrix.rows == 'native'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
        timeout-minutes: 10
        run: uv run pytest -v -s -o faulthandler_timeout=120 tests/differential/test_synthetic_origin.py

      # Row H-R1 of the differential harness: one host starts the server, calls
      # one read tool and quits, run Direct (K1), through the shared owner (K3),
      # and through the owner again (K0), then K3 is held to K1 on O1 and O4.
      # After the feasibility row, whose pass is what says this runner's fence
      # and trust hold, and opted in the same way.
      #
      # `DEBUG` here and on every row step after it, on Windows only. On that
      # leg a row's browser has been seen to vanish, its root and every child,
      # seconds after its context was ready and before the server began any
      # close, and nothing recorded why. Patchright's driver writes the
      # browser's exit code, and every close or kill it starts itself, to its
      # `pw:browser` channel, into the stderr of the server or owner that runs
      # it, which the row keeps whole (`events.OUTPUT_FILES` and
      # `events.OWNER_LOG_FILE`). A `<gracefully close start>` or `<kill>`
      # before `<process did exit: exitCode=...>` is a close the driver began;
      # an exit with neither is the browser's own or the system's, and its code
      # and the Windows event log kept on failure below are what tell those
      # apart. The actors inherit it through `harness.actor_environment`, the
      # frozen baseline's too. A green run pays a few lines per browser. On
      # the other legs the value is empty, which the driver's `debug` module
      # reads as nothing enabled, and nothing in this repository reads it.
      - name: Compare Direct and daemon on one host start and quit
        if: matrix.rows == 'native'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
        timeout-minutes: 20
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_host_quit_row.py

      # The frozen baseline (tests/differential/baseline.py): the pinned
      # pre-default-on revision in a worktree of its own, with its own
      # `uv sync` venv (runtime dependencies only, from its own lock) and its
      # own `patchright install` into a browser cache of its own, so none of it
      # is this checkout's. Refused unless HEAD is the pin and the worktree is
      # clean. The system libraries `--with-deps` installed above serve its
      # Chromium too.
      - name: Prepare the frozen baseline
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
        timeout-minutes: 15
        shell: bash
        run: uv run python tests/differential/baseline.py "$RUNNER_TEMP/differential-baseline"

      # Row H-CAL, an unfaulted person read through a held and released
      # section page, in K1 frozen, K3 and K0 (K2 recorded not applicable).
      # Every cell's actors idle out after 60s
      # (call_loss.CALIBRATION_IDLE_TIMEOUT_SECONDS), so the two owner waits
      # are bounded at 2 x (60 + 90) = 300s and the three passive browser
      # waits at 3 x 60 = 180s: eight minutes. The held page is let go as
      # soon as it entered, and the hold itself is bounded at 20s from entry
      # (synthetic_origin.GATE_DEADLINE_SECONDS). 30 leaves each cell about
      # seven minutes for staging, launches, the two reads, the quit and the
      # preservation session beyond its waits. `DEBUG` on this and every row
      # step after it, on Windows only, for the reason given at H-R1 above.
      - name: Hold and release a section of a person read
        if: matrix.rows == 'pipes'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 30
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_call_loss_rows.py -k "held_profile or held_read"

      # The signal oracle, as in `platform-behaviour`: H-R5 kills the Direct
      # server or the frontend, H-R8 and H-R9 the owner or the Direct server,
      # and on Linux a row that kills an actor is held to a complete trace.
      # macOS and Windows record it as unavailable.
      - name: Install the signal oracle
        if: runner.os == 'Linux' && (matrix.rows == 'native' || matrix.rows == 'processes' || matrix.rows == 'owner')
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_ACTIONS:-}" != true ] || [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ] || [ -n "${ACT:-}" ]; then
            echo "Refusing to trace processes outside a disposable GitHub-hosted runner" >&2
            exit 1
          fi
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq strace
          fi
          strace -V | head -1
          echo "kernel.yama.ptrace_scope: $(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo absent)"
          sudo -n true

      # K1 frozen on H-R1, and H-R12 (custom browser) in K1 frozen, K2 and K3.
      # Its own pytest run, so its packet is its own run directory next to the
      # H-R1 one in the evidence upload below.
      - name: Compare the frozen baseline and a custom browser
        if: matrix.rows == 'native'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 25
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_frozen_rows.py

      # Rows H-R3, host quit with an idle browser, and H-R2, a second host
      # while the first is open (tests/differential/host_comparison.py): H-R1's
      # actions read at checkpoints around the quit, and a second host on the
      # same profile between the first host's two reads. Each in K1 frozen, K3
      # and K0, then K3 held to K1 and K0 to K3. After the frozen rows, whose
      # baseline it reuses. Their actors idle out after 60s, not 20
      # (harness.COMPARISON_IDLE_TIMEOUT_SECONDS), so an owner wait is bounded
      # at 60 + 90. Six cells: four owners wait at most 4 x (60 + 90) = 600s,
      # every cell ends with one passive browser wait (60) and H-R2 in Direct
      # waits once more before A2, 7 x 60 = 420s; H-R2 in Direct also waits up
      # to 25s for its second host's lease and launches three browsers. Those
      # waits alone are 17 minutes, which left the 25 this step had for three
      # cells too little; 45 leaves each cell about 4.5 minutes for staging,
      # launches, reads and the preservation session beyond them. A cell that
      # meets every bound at once does not fit, as in every other row's step,
      # and fails.
      - name: H-R3 and H-R2 host comparisons
        if: matrix.rows == 'native'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 45
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_host_comparison_rows.py

      # Row H-R6, owner killed: K1 frozen (the Direct server killed), K2 (the
      # baseline owner killed, whose guardian must be seen killing the owner's
      # group) and K3 (the candidate owner killed, drained and recovered).
      - name: Kill the owner and the Direct server
        if: matrix.rows == 'native'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 25
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_owner_killed_rows.py

      # Row H-R11, a failed Job-membership query at a routine close, Windows
      # only: K1 frozen, K2 (the baseline owner reaches the failed query in
      # its close) and K3 (the candidate reaches it, stands down, and a
      # successor serves), then their composition with the source model of
      # the branch each routine takes. Each runs from a venv with one declared
      # shim (tests/differential/job_query.py), whose hash the evidence
      # records; no native evidence names the caller that ended an installer.
      - name: Fail the drain's Job query
        if: runner.os == 'Windows' && matrix.rows == 'native'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 25
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_failed_job_query_row.py

      # Row H-R7, a close the product cannot confirm: every actor starts from
      # a fault overlay (tests/differential/fault_overlay.py) whose declared
      # fault hands one selected drain's True back as False. K0 twice (the
      # plain runtime and the inert overlay), then K1 frozen, K2 and K3 three
      # times each, with the strace oracle above, then their composition with
      # the source model. A product-free child killing its own group under
      # this runner's strace calibrates K2's witness first.
      - name: Leave a close unconfirmed
        if: matrix.rows == 'native'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 45
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_unconfirmed_close_row.py

      # Rows H-R4 and H-R5: the same read lost once its held page entered,
      # released 15s after that entry (call_loss.RELEASE_SECONDS), in K1
      # frozen, K3 and K0 (K2 recorded not applicable), one step per row,
      # chosen by keyword. Each cell adds to the calibration's seven minutes:
      # the release and the 10s watch after it; the server's or frontend's
      # own exit (bound 90s); in K1 the browser wait (60s), the census and
      # the lease; in K3 and K0 the owner's idle exit (60 + 90s); the
      # residual browser wait (60s); and a fresh host's start and read (two
      # minutes). Three cells come to at most 42 minutes: 45 each.
      - name: Lose the host mid-read by stdin EOF
        if: matrix.rows == 'pipes'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 45
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_call_loss_rows.py -k eof

      - name: Lose the host mid-read by abrupt pipe loss
        if: matrix.rows == 'pipes'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 45
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_call_loss_rows.py -k pipe

      - name: Kill the host process mid-read
        if: matrix.rows == 'processes'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 45
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_call_loss_rows.py -k host_killed

      - name: Lose the host with two requests outstanding
        if: matrix.rows == 'processes'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 45
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_call_loss_rows.py -k two_requests

      - name: Kill the server or frontend mid-read
        if: matrix.rows == 'processes'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 45
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_call_loss_rows.py -k killed_mid_read

      # Row H-R13: the read raced against the owner's idle exit, with its own
      # 8s idle timeout (retirement_race.IDLE_RACE_TIMEOUT_SECONDS), in K1
      # frozen, K3 and K0 (K2 recorded not applicable), one step per lane.
      # Each cell is the calibration's seven minutes with an idle timeout of
      # 8s instead of 60s, plus its own waits. Admission wins: the hold (at
      # most 18s), the owner's or Direct's idle exit after the read (8 + 60s)
      # and the browser after it (60s). Retirement wins: the idle line (8 +
      # 60s), the owner's exit or the browser (60s), and the call through an
      # election (bound 180s). Then the owner's or successor's own idle exit
      # (8 + 90s) and the residual browser wait (60s). Three cells come to at
      # most 45 minutes: 50 each.
      - name: Race an admitted read against the idle exit
        if: matrix.rows == 'idle'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 50
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_idle_race_rows.py -k admitted

      - name: Call after the owner idled out
        if: matrix.rows == 'idle'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 50
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_idle_race_rows.py -k idled_out

      # The turnover lanes, daemon only: K3 and K0, with K1 a counted skip
      # (a policy, not parity) and K2 recorded not applicable, in the
      # calibration's 60s configuration. Each cell adds to the calibration's
      # seven minutes: the stand-down and the reads through the drain (30s)
      # or past it, each read bounded at 180s; the owner's stand-down (90s);
      # where a successor served, its idle exit (60 + 90s); and the residual
      # browser wait (60s). Two cells come to at most 30 minutes: 35 each.
      # They do not discharge W6.
      - name: Turn the owner over with held work inside the drain
        if: matrix.rows == 'idle'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 35
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_idle_race_rows.py -k "turns_over and drain"

      - name: Refuse new work after a turnover
        if: matrix.rows == 'idle'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 35
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_idle_race_rows.py -k "turns_over and refused"

      - name: Cut a read that outlasts the drain
        if: matrix.rows == 'idle'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 35
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_idle_race_rows.py -k "turns_over and cut"

      - name: Refuse a queued read as not run
        if: matrix.rows == 'idle'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 35
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_idle_race_rows.py -k "turns_over and queued"

      # Row H-R8: the owner out of service between two calls, in K1 frozen
      # (the same requests through Direct, no hop), K3 and K0 (K2 recorded
      # not applicable), one step per lane, in the calibration's 60s
      # configuration. Each cell is the calibration's seven minutes plus its
      # own waits: the kill and the owner's death (15s), the read through an
      # election and a replay (bound 180s), the oracle's stop (30s), then the
      # successor's own idle exit (60 + 90s) and the residual browser wait
      # (60s). Three cells come to at most 37 minutes: 40 each. The stopped
      # owner adds its declared 20s stop and a later read (another 180s
      # bound) to K3 and K0, and runs nowhere on Windows (counted skips):
      # 45. Retiring is H-R13's.
      - name: Lose the owner before a call
        if: matrix.rows == 'owner'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 40
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_owner_loss_rows.py -k unreachable

      - name: Stop the owner before a call
        if: matrix.rows == 'owner'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 45
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_owner_loss_rows.py -k stopped

      - name: Answer the dead owner's preflight with 404
        if: matrix.rows == 'owner'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 40
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_owner_loss_rows.py -k responder_404

      - name: Answer the dead owner's preflight with 500
        if: matrix.rows == 'owner'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 40
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_owner_loss_rows.py -k responder_500

      # Row H-R9: a message's first navigation held, then the Direct server
      # (K1 frozen) or the owner (K3, K0) killed. Each cell adds to the
      # calibration's seven minutes: the message through an election (bound
      # 180s), the release 15s after entry and the 10s watch; in K1 the
      # guardian and browser settlement (60s each) and a fresh host's read
      # (two minutes); in K3 and K0 a read through the successor (180s) and
      # its idle exit (60 + 90s); the oracle's stop (30s) and the residual
      # browser wait (60s). Three cells come to at most 47 minutes: 50.
      - name: Lose the owner after a message's dispatch
        if: matrix.rows == 'owner'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 50
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_owner_loss_rows.py -k message

      # Row H-R10a, a confirmed logout beside an idle owner, on a terminal:
      # K1 frozen after its server settled, K3 retiring the owner, and K0 (K2
      # recorded not applicable); counted skips on Windows, which has no
      # pseudo-terminal. Each cell is the calibration's seven minutes and
      # its own waits: the host's quit (90s), Direct's settlement (60s and a
      # census) or a checkpoint (60s), the logout from its start (a prompt
      # within 60s, then the product's own 60s wait for the profile and the
      # clear, bound 90s) and the residual browser wait (60s); nothing is
      # preserved after a clear. Three cells come to at most 27 minutes: 30.
      - name: Log out beside an idle owner
        if: matrix.rows == 'commands'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 30
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_profile_command_rows.py -k logout

      # H-R10a's daemon cells, K3 and K0, K1 a counted skip: the retirement
      # declined on a terminal (a skip on Windows), and no terminal at all, on
      # pipes. Each adds to the calibration's seven minutes the host's quit
      # (90s), two checkpoints (60s each), the logout (a prompt within 60s
      # and the answer's end within 15s), the 5s watch, the owner's own idle
      # exit (60 + 90s) and the residual browser wait (60s). Four cells come
      # to at most 38 minutes: 40.
      - name: Decline or lack a terminal beside an idle owner
        if: matrix.rows == 'commands'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 40
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_profile_command_rows.py -k "decline or no_terminal"

      # Row H-R10b: logout, login and import inside the three held sections
      # of one read, K1 frozen, K3 and K0, counted skips on Windows. Each
      # cell adds to the calibration's seven minutes three commands (a prompt
      # within 60s, then at most 18s inside its hold), the read's end (120s),
      # the owner's idle exit (60 + 90s) and the residual browser wait (60s).
      # Three cells come to at most 39 minutes: 40.
      - name: Run profile commands beside a busy owner
        if: matrix.rows == 'commands'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 40
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_profile_command_rows.py -k busy

      # Row H-R15: --status on pipes beside the open host's owner or Direct
      # server, K1 frozen, K3 and K0, on every leg. Each cell adds to the
      # calibration's seven minutes two checkpoints and two root readings
      # (60s each), the status (90s) and a read, then the owner's idle exit
      # (60 + 90s) and the residual browser wait (60s). Three cells come to
      # at most 30 minutes: 30.
      - name: Check the status beside a live owner
        if: matrix.rows == 'commands'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 30
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_profile_command_rows.py -k status

      # Row H-R16's cold repair and its second frontend, a sign-in staged at
      # the origin: K1 frozen, K3 and K0 of the cold cell, K3 and K0 of the
      # second (its K1 a counted skip). Each cell is the calibration's seven
      # minutes and its own waits: the warm browser gone (60s), the login's
      # first ask (120s), the read (150s), the completion (90s), the host's
      # quit (90s), the owner's idle exit (60 + 90s) and the residual browser
      # wait (60s), 19 minutes; the second frontend adds its host (240s), 23.
      # Five cells come to at most 103 minutes: 105.
      - name: Repair a lost session through the owner
        if: matrix.rows == 'auth'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
          # The login is headed; only Linux has a display to name.
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
        timeout-minutes: 105
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_auth_repair_rows.py -k "cold or second"

      # H-R16's failed login, never released: K1 frozen, K3 and K0. Each cell
      # adds to the calibration's seven minutes the warm browser gone (60s),
      # the first ask (120s), the read (150s), the login's own budget and its
      # settlement (60 + 60s), the host's quit (90s), the owner's idle exit
      # (60 + 90s) and the residual browser wait (60s), 20 minutes. Three
      # cells come to at most 60 minutes: 60.
      - name: Fail a login the origin never completes
        if: matrix.rows == 'auth'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
        timeout-minutes: 60
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_auth_repair_rows.py -k failed

      # Row H-R10a's login on a terminal, K1 frozen after its server settled
      # and K3 retiring the idle owner, and K0; counted skips on Windows, as
      # are the response-loss and import lanes everywhere. Each cell adds to
      # the calibration's seven minutes the host's quit (90s), Direct's
      # settlement or a checkpoint (60s), the prompt (60s), a checkpoint
      # (60s), the owner's exit (90s), the first ask (120s), the completion
      # (90s), the command's end (25s) and the residual browser wait (60s),
      # 18 minutes. Three cells come to at most 54 minutes: 55.
      - name: Sign in again beside an idle owner
        if: matrix.rows == 'auth'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
        timeout-minutes: 55
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_auth_repair_rows.py -k "login or natively"

      # The H-R12 remainder: each configuration the daemon refuses, K1 frozen
      # Direct, K3 with the daemon enabled and K0 (K2 recorded not
      # applicable), held to no coordination effect and a Direct read. Each
      # cell is the calibration's seven minutes and its own waits: the storage
      # reading (30s) and the residual browser wait (60s); nothing is an owner
      # to idle out. Switched off by DAEMON_ENABLED=false and by --no-daemon:
      # six cells come to at most 51 minutes: 55.
      - name: Keep a switched-off daemon Direct
        if: matrix.rows == 'eligibility'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 55
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_eligibility_rows.py -k "disabled_env or no_daemon"

      # A container (LINKEDIN_MCP_CONTAINER=true, the session staged and
      # preserved as the same runtime): three cells, at most 26 minutes: 30.
      - name: Keep a container Direct
        if: matrix.rows == 'eligibility'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 30
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_eligibility_rows.py -k container

      # An HTTP server on a loopback port of its own, quit by its interrupt;
      # counted skips on Windows. Each cell adds to the above the port's
      # listening (bound 180s): three cells, at most 35 minutes: 40.
      - name: Keep an HTTP server Direct
        if: matrix.rows == 'eligibility'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 40
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_eligibility_rows.py -k http

      # Synced storage: a Dropbox info.json naming the row's auth root, one
      # naming the daemon state root, and on macOS a profile under
      # ~/Library/CloudStorage (counted skips elsewhere), each planted for its
      # cell only, refused where any provider configuration already is, and
      # removed exactly. Nine cells come to at most 77 minutes: 80.
      - name: Keep synced storage Direct
        if: matrix.rows == 'eligibility'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 80
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_eligibility_rows.py -k "synced or cloud_storage"

      # Unknown storage: a malformed Dropbox info.json, planted and removed
      # the same way. Three cells, at most 26 minutes: 30.
      - name: Keep unknown storage Direct
        if: matrix.rows == 'eligibility'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 30
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_eligibility_rows.py -k unknown

      # Row H-R14: host B with LOGIN_TIMEOUT one second apart while A is open,
      # K1 frozen, K3 and K0. Each cell adds to the calibration's seven
      # minutes the storage reading (30s), three owner readings (30s each),
      # B's whole session (240s), the settlement before A2 (a 60s browser
      # wait, a census and the lock, 60s each), A2 (180s), the owner's idle
      # exit (120 + 90s) and the residual browser wait (60s), 24 minutes.
      # Three cells come to at most 71 minutes: 75.
      - name: Leave a differently configured owner alone
        if: matrix.rows == 'eligibility'
        env:
          LINKEDIN_MCP_DIFFERENTIAL_CI: "1"
          LINKEDIN_MCP_DIFFERENTIAL_CA_DIR: ${{ runner.temp }}/synthetic-origin
          LINKEDIN_MCP_DIFFERENTIAL_OUT: ${{ runner.temp }}/differential-calls-evidence
          DEBUG: ${{ matrix.os == 'windows-latest' && 'pw:browser' || '' }}
          LINKEDIN_MCP_DIFFERENTIAL_BASELINE: ${{ runner.temp }}/differential-baseline
        timeout-minutes: 75
        run: uv run pytest -v -s -o faulthandler_timeout=300 tests/differential/test_eligibility_rows.py -k rival

      # Windows' own record of the job's window, into the evidence folder the
      # step below uploads, under `windows/`: Application faults, hangs and
      # error reports, System errors and criticals, everything Defender
      # logged, and the minidumps armed above. The three Application providers
      # are read one at a time: Get-WinEvent checks every name in a query
      # before it reads, and one this image does not have would drop the
      # other two. Beside the driver's exit code these tell a crash (a fault
      # record, a dump) from an external kill (a Defender action, a system
      # error, and no fault) from a close the driver began (its own log line,
      # and nothing here). Only on failure, so a green run pays nothing, and
      # it reports without deciding: an empty or missing log is written as
      # such and the step never fails.
      #
      # Chromium dumps on Windows whether or not Playwright passed
      # `--disable-breakpad` (verified in the 149 and 153 sources), so a fault
      # inside the browser reaches Crashpad and not Windows Error Reporting,
      # and the LocalDumps folder armed above is not a guaranteed capture.
      # The copy below is what keeps that report: a `.dmp` under the profile's
      # `Crashpad\reports`. The rows keep their profiles under pytest's
      # temporary root (`isolate_profile_dir` in tests/conftest.py), and the
      # harness removes a row's daemon directory but never a profile. Pytest
      # keeps its last three sessions, and the failing step's is the newest
      # because a failure skips every later test step, so its dumps are still
      # there unless the product's own runtime-profile rotation took one.
      - name: Keep Windows' record of the failure
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          EVIDENCE: ${{ runner.temp }}/${{ matrix.rows == 'native' && 'differential-evidence' || 'differential-calls-evidence' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:EVIDENCE 'windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $since = (Get-Date).AddHours(-6)
          $mark = Join-Path $env:RUNNER_TEMP 'windows-evidence-since.txt'
          if (Test-Path $mark) { $since = [datetime]::Parse((Get-Content $mark -Raw).Trim()) }
          $faults = Join-Path $out 'application-faults.txt'
          "Events since $($since.ToUniversalTime().ToString('o'))" | Out-File -FilePath $faults -Encoding utf8
          # One provider per query. Get-WinEvent checks every ProviderName
          # before it reads anything, so one this image does not have would
          # drop the records of the other two.
          foreach ($provider in 'Application Error', 'Windows Error Reporting', 'Application Hang') {
            "Provider: $provider" | Out-File -FilePath $faults -Append -Encoding utf8
            try {
              Get-WinEvent -FilterHashtable @{
                LogName = 'Application'
                ProviderName = $provider
                StartTime = $since
              } -ErrorAction Stop |
                Sort-Object TimeCreated |
                Format-List TimeCreated, Id, LevelDisplayName, ProviderName, ProcessId, Message |
                Out-File -FilePath $faults -Append -Encoding utf8 -Width 4096
            } catch {
              "None read: $($_.Exception.Message)" | Out-File -FilePath $faults -Append -Encoding utf8
            }
          }
          $queries = [ordered]@{
            'system-errors.txt' = @{ LogName = 'System'; Level = 1, 2; StartTime = $since }
            'defender.txt' = @{
              LogName = 'Microsoft-Windows-Windows Defender/Operational'
              StartTime = $since
            }
          }
          foreach ($name in $queries.Keys) {
            $file = Join-Path $out $name
            "Events since $($since.ToUniversalTime().ToString('o'))" | Out-File -FilePath $file -Encoding utf8
            try {
              Get-WinEvent -FilterHashtable $queries[$name] -ErrorAction Stop |
                Sort-Object TimeCreated |
                Format-List TimeCreated, Id, LevelDisplayName, ProviderName, ProcessId, Message |
                Out-File -FilePath $file -Append -Encoding utf8 -Width 4096
            } catch {
              "None read: $($_.Exception.Message)" | Out-File -FilePath $file -Append -Encoding utf8
            }
          }
          $dumps = Join-Path $env:RUNNER_TEMP 'browser-crash-dumps'
          if (Get-ChildItem -Path $dumps -File -ErrorAction SilentlyContinue) {
            Copy-Item -Path $dumps -Destination (Join-Path $out 'crash-dumps') -Recurse -Force
          }
          $crashpad = Join-Path $out 'crashpad'
          # The newest, not the first found. Pytest keeps its last sessions,
          # and the failing row is the latest one. The first 32 in directory
          # order can all belong to earlier rows.
          Get-ChildItem -Path ([IO.Path]::GetTempPath()) -Directory -Filter 'pytest-of-*' -ErrorAction SilentlyContinue |
            Get-ChildItem -Recurse -File -Filter '*.dmp' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 32 |
            ForEach-Object {
              New-Item -ItemType Directory -Force -Path $crashpad | Out-Null
              $_.FullName | Out-File -FilePath (Join-Path $crashpad 'sources.txt') -Append -Encoding utf8
              Copy-Item -LiteralPath $_.FullName -Destination $crashpad -Force
            }
          exit 0

      # The rows' evidence packet: events, counts, watcher output, failures,
      # what the actors wrote and the runtime identity, and nothing else
      # (``events.PUBLISHED_FILES``), and on a red Windows leg the folder the
      # step above adds, under a name apart from the other jobs' packets.
      # Always, so a red row keeps what made it red.
      - name: Keep the differential evidence
        if: always() && matrix.rows == 'native'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/differential-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the differential call evidence
        if: always() && matrix.rows != 'native'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-calls-evidence-${{ matrix.os }}-${{ matrix.rows }}
          path: ${{ runner.temp }}/differential-calls-evidence
          if-no-files-found: warn
          retention-days: 14

      - run: uv cache prune --ci
