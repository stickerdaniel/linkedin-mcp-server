# .github/workflows/forwarder-compat.yml
#
# The frontend's forwarder against the newest FastMCP, MCP SDK and httpx2
# releases, rather than the locked ones.
#
# `uvx` resolves all three fresh on every install, inside the ranges
# `pyproject.toml` declares. Those ranges stop at the next minor, so a new
# minor reaches users only through the Renovate pull request that raises the
# cap, and this workflow runs on that pull request. The forwarder reaches the
# libraries through public names only (tests/test_daemon_forwarder.py holds
# that line), and this job is what shows that the public names still behave:
# the hop's pinned protocol version, the dispatch record read off the wire,
# progress, and the fidelity of what a client reads.
#
# Two ranges run:
# - `declared`: the newest releases the declared ranges allow, what a user
#   installs today. A failure here reaches users.
# - `major`: the newest releases below the next major, on the schedule and on
#   dispatch only. A failure here reaches nobody yet. It names the minor that
#   will fail its Renovate pull request, days before that pull request opens.
name: Forwarder compatibility

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "linkedin_mcp_server/daemon/**"
      - "linkedin_mcp_server/server.py"
      - "tests/owner_hop.py"
      - "tests/test_daemon_forwarder.py"
      - "tests/test_daemon_proxy.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/forwarder-compat.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newest:
    name: Forwarding on the newest FastMCP and MCP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        range: [declared, major]
        # A pull request tests what its own ranges allow; a release beyond
        # them is not that pull request's failure.
        exclude:
          - range: ${{ github.event_name == 'pull_request' && 'major' || 'none' }}
    # The selection below runs in well under a minute locally; the bound is for
    # a wedged hop, which would otherwise hold the runner for six hours.
    timeout-minutes: 15
    # The camelCase read shims off, for the reason given in ci.yml.
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # Re-resolved inside the ranges `pyproject.toml` declares. Their own
      # dependencies move with them as the resolver needs. The lock this
      # writes stays on the runner.
      - name: Resolve the newest declared FastMCP, MCP and httpx2
        run: >-
          uv sync --group dev
          --upgrade-package fastmcp --upgrade-package mcp --upgrade-package httpx2

      # Past the minor caps, up to the next major, which is a deliberate bump
      # and not tested here.
      - name: Install the newest FastMCP, MCP and httpx2 below the next major
        if: matrix.range == 'major'
        run: >-
          uv pip install "fastmcp<5" "mcp<3" "httpx2<3"
          --upgrade-package fastmcp --upgrade-package mcp --upgrade-package httpx2

      - name: Report the versions under test
        run: >-
          uv run --no-sync python -c "from importlib.metadata import version;
          print(*(f'{name} {version(name)}' for name in ('fastmcp', 'mcp', 'httpx2', 'anyio')), sep='\n')"

      - name: Run the forwarding tests
        run: >-
          uv run --no-sync pytest -n auto -o faulthandler_timeout=120
          tests/test_daemon_forwarder.py
          tests/test_daemon_proxy.py
          tests/test_daemon_auth.py
          tests/test_daemon_liveness.py
          tests/test_server.py
          tests/test_fastmcp_compatibility.py
          tests/test_daemon_election.py::TestAForwardedCallThroughTheRealOwner
          tests/test_daemon_election.py::TestTheProbeSpeaksTheHopsVersion

      - run: uv cache prune --ci
