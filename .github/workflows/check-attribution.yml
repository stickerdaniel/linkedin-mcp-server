name: Check Attribution

on:
  # Stacked pull requests need the same checks before reaching main.
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-bot-coauthors:
    runs-on: ubuntu-latest
    steps:
      - name: Check agent attribution and hidden Unicode
        uses: stickerdaniel/agent-guardrails@a3508d7320e64370b878359b1f4ae541b507224f # v1.0.0
        with:
          require-model-attribution: true
