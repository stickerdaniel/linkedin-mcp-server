name: Check Attribution

on:
  # Stacked pull requests need the same checks before reaching main.
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-bot-coauthors:
    runs-on: ubuntu-latest
    steps:
      - name: Check agent attribution and hidden Unicode
        uses: stickerdaniel/post-no-bills@207fb1f8bd0b30d17bc0b43f19c811f8fd87c9a5 # v4.0.0
        with:
          model-attribution: host
        # Bind live evidence to this run, not a later branch-tip lookup.
        env:
          GUARDRAILS_WORKFLOW_REF: ${{ github.workflow_ref }}
          GUARDRAILS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GUARDRAILS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GUARDRAILS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
