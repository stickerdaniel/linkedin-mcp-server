# .github/workflows/election-soak.yml
#
# The reproducer for #838, on demand.
#
# The eight-client election crashed a frontend with 0xC0000005 on Windows
# CPython 3.12.10 and never gave up a fault location. #996 skipped the test on
# every Windows 3.12, and #1003 then dropped the floating `3.12` matrix entry
# altogether, so the crashing interpreter now appears in no push or pull request
# run at all. That is the right default for a job every unrelated pull request
# waits on, and it also means CI can no longer produce the evidence #838 needs.
#
# This workflow puts that interpreter back, by hand, with the skip lifted and
# Windows Error Reporting armed. It is the only path from "skipped" to either a
# minidump naming the faulting frame or a soak clean enough to lift the skip.
name: Election soak

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Windows CPython to soak (3.12.10 is the one that crashed)"
        type: string
        default: "3.12.10"
      rounds:
        description: "Eight-client elections to run, stopping at the first crash"
        type: number
        default: 20

permissions:
  contents: read

env:
  TARGET: tests/test_daemon_election.py::TestRealOwner::test_many_clients_starting_at_once_elect_exactly_one_owner
  # Lifts the #838 skip. Read at collection, so it has to be in the environment
  # before pytest starts rather than set from inside a test.
  LINKEDIN_MCP_ELECTION_SOAK: "1"

jobs:
  soak:
    name: Election soak
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - run: uv sync --group dev

      # Minidumps, written from outside the failing process. `faulthandler`
      # has now been read out in full and it cannot name this fault: the dump
      # is complete, every thread is printed as `Thread 0x…` and none as
      # `Current thread 0x…`. `faulthandler_dump_traceback` takes the faulting
      # thread from `PyGILState_GetThisThreadState()` and
      # `_Py_DumpTracebackThreads` marks a thread only on pointer equality with
      # it, so an unmarked dump means that call returned NULL: the thread that
      # access-violated holds no Python thread state, and no Python-level
      # report can describe it. Only a native stack can.
      #
      # WER's LocalDumps alone did not produce one. Armed exactly as it was
      # before this change, run 35367449209 caught the access violation and
      # still uploaded nothing. The runner image leaves Windows Error
      # Reporting disabled, and a disabled WER never consults LocalDumps at
      # all, which looks the same in the log as a run that never crashed.
      - name: Arm a crash dump
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null

          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-Item -Path $wer -Force | Out-Null
          Set-ItemProperty -Path $wer -Name Disabled -Value 0 -Type DWord
          # No dialog: a crash that waits for a click would hang the job
          # instead of failing it.
          Set-ItemProperty -Path $wer -Name DontShowUI -Value 1 -Type DWord

          $key = Join-Path $wer 'LocalDumps'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $folder -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpCount -Value 16 -Type DWord
          Set-ItemProperty -Path $key -Name DumpType -Value 1 -Type DWord

          Set-Service -Name WerSvc -StartupType Manual
          Get-Service WerSvc | Format-List Name, Status, StartType

      # The process that dies is a grandchild: the test starts eight
      # frontends and each of those starts a daemon of its own. No step here
      # can attach to the one that will fault, and which one it is only
      # becomes known once it is already gone. So the debugger has to be the
      # one Windows starts *after* a process dies. `procdump -i` registers
      # itself under `AeDebug` for 64-bit and 32-bit alike, and that path is
      # taken on an unhandled exception whether or not WER answers, which is
      # the failure this is here to cover.
      - name: Register a postmortem debugger
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          $tools = Join-Path $env:RUNNER_TEMP 'procdump'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $zip = Join-Path $tools 'Procdump.zip'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://download.sysinternals.com/files/Procdump.zip' `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tools -Force
          $exe = Join-Path $tools 'procdump64.exe'
          if (-not (Test-Path $exe)) { $exe = Join-Path $tools 'procdump.exe' }
          & $exe -accepteula -ma -i $folder
          if ($LASTEXITCODE -ne 0) {
            throw "procdump -i failed with exit code $LASTEXITCODE"
          }
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AeDebug' |
            Format-List Debugger, Auto

      # A soak whose test was skipped reports the same green as a soak that
      # held, and would be read as grounds to lift the skip. So the predicate
      # pytest is about to evaluate is evaluated here first, in this same
      # environment: if the variable above did not reach it, this fails now
      # rather than after twenty rounds of running nothing. That predicate is
      # the only thing that can skip this test, so a run past it is a run.
      - name: Prove the skip is lifted
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "tests")
          from test_daemon_election import _ELECTION_SOAK, _skip_the_election_stress

          if _skip_the_election_stress(
              name=os.name,
              implementation=sys.implementation.name,
              version=sys.version_info[:2],
              soak=os.environ.get(_ELECTION_SOAK),
          ):
              raise SystemExit(f"{_ELECTION_SOAK} did not lift the #838 skip")
          PY

      - name: Soak the eight-client election
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          # A round count of zero would leave the loop below with nothing to do
          # and report the same green as a soak that held, which is the reading
          # the step above exists to refuse. `number` accepts zero, negatives
          # and decimals, so it is checked here rather than trusted.
          if ! [[ "$ROUNDS" =~ ^[0-9]+$ ]] || (( ROUNDS < 1 )); then
            echo "rounds must be a positive whole number, got: $ROUNDS"
            exit 1
          fi
          for (( round = 1; round <= ROUNDS; round++ )); do
            echo "::group::round $round of $ROUNDS"
            uv run pytest "$TARGET" -q -x
            echo "::endgroup::"
          done

      # The upload below reports "no files were found" both for a run that
      # never crashed and for a run that crashed while every dump mechanism
      # stayed silent. That is the reading that cost run 35367449209, so the
      # folder and the system's own record of the fault are printed here.
      - name: Report what the dump folder holds
        if: always()
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'crash-dumps'
          Get-ChildItem -Path $folder -Force -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Format-Table -AutoSize
          Get-WinEvent -MaxEvents 10 -ErrorAction SilentlyContinue -FilterHashtable @{
            LogName = 'Application'
            ProviderName = 'Application Error', 'Windows Error Reporting'
          } | Select-Object TimeCreated, ProviderName, Message | Format-List

      - name: Upload the crash dump
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps
          path: ${{ runner.temp }}/crash-dumps
          if-no-files-found: ignore
          retention-days: 14
