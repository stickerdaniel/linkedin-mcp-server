name: PR Title

# GitHub suppresses pull_request_target for SHA-like source branch names.
# Renaming a head branch closes its pull request. Open a replacement pull
# request from a non-SHA-like source branch so this check and Label PR can run.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Fetch current pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "$RUNNER_TEMP/pull-request.json"

      # The fragment requirement follows the title, and this workflow already
      # reruns on every retitle. The PR's files are read as API data only; the
      # checker and the towncrier config it reads come from the checkout above.
      # Both fetches come first so that no step after the title validation
      # holds a token.
      - name: Fetch changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "$RUNNER_TEMP/pull-request-files.json"

      - name: Validate current pull request title
        run: python3 scripts/check_pr_title.py --pr-json "$RUNNER_TEMP/pull-request.json"

      - name: Require a changelog fragment
        run: |
          python3 scripts/check_changelog_fragment.py \
            --pr-json "$RUNNER_TEMP/pull-request.json" \
            --files-json "$RUNNER_TEMP/pull-request-files.json"
