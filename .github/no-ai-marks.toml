# Config for the no-ai-marks action that .github/workflows/check-unicode.yml
# runs. The action reads this file from the PR's base commit, never from the
# PR itself, so a change here takes effect only after it merges.
#
# Only the Unicode rules stay on. Attribution is check-attribution.yml's job,
# and ai-footer would reject the "Generated with" line the PR template
# requires. A no-ai-marks update can add AI rules that are on by default;
# switch each one off here when Renovate brings it in.
fail-on = "error"

[rules]
ai-trailer = "off"
ai-identity = "off"
ai-footer = "off"
ai-tag = "off"
ai-emoji = "off"
ai-session-link = "off"
ai-branch = "off"
ai-metadata = "off"
c2pa-manifest = "off"
